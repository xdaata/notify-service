<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notify Service</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main>
  <header>
    <h1>Notify Service</h1>
    <div class="top">
      <span class="live" id="live" role="status"></span>
      <button type="button" id="lang" class="lang" role="switch" aria-label="Язык / Language"><span class="thumb"></span><span class="opt">RU</span><span class="opt">EN</span></button>
    </div>
  </header>

  <section class="flow" aria-label="Events by status">
    <div class="stage" data-s="queued">
      <span class="n" id="n-queued">0</span>
      <span class="name" data-i18n="queued"></span>
      <span class="hint" data-i18n="hintQueued"></span>
    </div>
    <span class="link" aria-hidden="true"></span>
    <div class="stage" data-s="processing">
      <span class="n" id="n-processing">0</span>
      <span class="name" data-i18n="processing"></span>
      <span class="hint" data-i18n="hintProcessing"></span>
    </div>
    <span class="link" aria-hidden="true"></span>
    <div class="stage" data-s="sent">
      <span class="n" id="n-sent">0</span>
      <span class="name" data-i18n="sent"></span>
      <span class="hint" data-i18n="hintSent"></span>
    </div>
    <span class="split" aria-hidden="true"></span>
    <div class="stage" data-s="failed">
      <span class="n" id="n-failed">0</span>
      <span class="name" data-i18n="failed"></span>
      <span class="hint" data-i18n="hintFailed"></span>
    </div>
    <span class="scope" data-i18n="scope"></span>
  </section>

  <div class="grid">
    <section class="panel">
      <h2 data-i18n="newEvent"></h2>
      <form id="form">
        <label><span data-i18n="type"></span>
          <input type="text" id="type" value="user_registered" required>
        </label>
        <label><span data-i18n="payload"></span>
          <textarea id="payload" spellcheck="false">{"user_id": 1}</textarea>
        </label>
        <label><span data-i18n="key"></span>
          <span class="keyrow">
            <input type="text" id="key" required spellcheck="false">
            <button type="button" id="newkey" data-i18n="newKey"></button>
          </span>
        </label>
        <label class="check"><input type="checkbox" id="keep"> <span data-i18n="keep"></span></label>
        <button class="primary" id="send" data-i18n="create"></button>
      </form>
      <p id="say" aria-live="polite"></p>
    </section>

    <section class="panel">
      <h2 data-i18n="events"></h2>
      <div class="banner" id="banner" hidden data-i18n="offline"></div>
      <div class="row head" aria-hidden="true">
        <span class="c-status" data-i18n="colStatus"></span>
        <span class="c-type" data-i18n="colType"></span>
        <span class="c-id" data-i18n="colId"></span>
        <span class="c-time" data-i18n="colTime"></span>
      </div>
      <ul class="feed" id="feed"></ul>
      <p class="empty" id="empty" hidden data-i18n="empty"></p>
    </section>
  </div>
</main>

<script src="/static/app.js"></script>
</body>
</html>
